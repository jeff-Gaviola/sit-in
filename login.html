
 <!DOCTYPE html>
 <html lang="en">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Login | CCS Monitoring System</title>
     <link rel="stylesheet" href="style.css">
 </head>
 <body>
 
     <nav class="navbar">
         <div class="nav-container">
             <div class="brand">College of Computer Studies Sit-in Monitoring System</div>
             <ul class="nav-links">
                 <li><a href="#">Home</a></li>
                 <li><a href="#">Community ▾</a></li>
                 <li><a href="#">About</a></li>
                 <li><a href="index.html">Login</a></li>
                 <li><a href="register.html">Register</a></li>
             </ul>
         </div>
     </nav>
 
     <div class="main-container">
         <div class="logo-side">
     
             <img src="download.png" alt="CCS Logo" class="ccs-logo">
         </div>
 
         <div class="form-side">
             <div class="login-box">
                <h2>Student Login</h2>
                <form id="loginForm" onsubmit="handleLogin(event)">
                     <div class="input-group">
                        <input type="text" id="id-number" placeholder="Enter a valid id number" required>
                         <label for="id-number">ID Number</label>
                     </div>
 
                     <div class="input-group">
                        <input type="password" id="password" placeholder="Enter password" required>
                         <label for="password">Password</label>
                     </div>
 
                     <div class="form-actions">
                         <label class="checkbox-container">
                             <input type="checkbox"> Remember me
                         </label>
                         <a href="#" class="forgot-pwd">Forgot password?</a>
                     </div>
 
                     <button type="submit" class="btn-login">Login</button>
                 </form>
 
                 <div class="register-text">
                     Don't have an account? <a href="register.html">Register</a>
                 </div>
                
                
             </div>
         </div>
     </div>
 
    <script src="script.js"></script>
 </body>
 </html>
