<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | CCS Monitoring System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="signup-container">
        <a href="index.html" class="btn-back">Back</a>
        

        <div class="content-wrapper">
            <div class="form-side">
                <h1>Sign up</h1>
                
                <form id="registerForm">
                    <div class="input-group"><input type="text"><label>ID Number</label></div>
                    <div class="input-group"><input type="text"><label>Last Name</label></div>
                    <div class="input-group"><input type="text"><label>First Name</label></div>
                    <div class="input-group"><input type="text"><label>Middle Name</label></div>
                    <div class="input-group">
                     <select id="course">
                        <option value="BSIT">BSIT</option>
                         <option value="BSCS">BSCS</option>
                         <option value="BSIS">BSIS</option>
                         <option value="BSEMC">BSEMC</option>
                    </select>
                    
                     <label for="course">Course</label>
                    <div class="input-group"><input type="number" value="1"><label>Course Level</label></div>
                    <div class="input-group"><input type="password"><label>Password</label></div>
                    <div class="input-group"><input type="password"><label>Repeat your password</label></div>
                    <div class="input-group"><input type="email"><label>Email</label></div>
                    
                       
                </div>
                    <div class="input-group"><input type="text"><label>Address</label></div>

                    <button type="submit" class="btn-register">Register</button>
                </form>
            </div>

            <div class="image-side">
                <img src="example.jpg"Illustration>
            </div>
        </div>
    </div>

</body>
</html>
